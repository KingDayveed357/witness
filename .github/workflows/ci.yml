name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Architecture rules (capture isolation)
        run: pnpm deps:check
      - name: Unit, contract and spike tests
        run: pnpm vitest run --project unit && node --test "test/*.test.mjs"
      - name: Integration tests on real Postgres (embedded)
        run: pnpm vitest run --project db
